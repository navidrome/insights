services:
  ingest:
    image: ghcr.io/navidrome/insights:main
    command: ["/ingest"]
    restart: unless-stopped
    # ingest logs every request with its client IP, which measured 19 MB a day in production.
    # The json-file driver keeps everything by default, and the purge measures free space on the
    # whole volume, so an unrotated log makes it delete report days to make room for log files.
    # 30 MB is enough to debug a bad deploy and small enough to stay out of the purge's way.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "1000:1000"
    # Longer than the shutdown budget: ingest gives in-flight reports 10s to finish, then up to
    # 5s more for any handler the shutdown deadline gave up on, and only then closes the report
    # writer. Docker's default grace is 10s, which would SIGKILL partway through that — the gzip
    # member of the open segment never gets its trailer and the buffered tail is lost.
    stop_grace_period: 20s
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATA_FOLDER=/app
    volumes:
      - .:/app

  process:
    image: ghcr.io/navidrome/insights:main
    command: ["/process"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "1000:1000"
    # Longer than the shutdown budget: process gives in-flight requests 10s, then up to 30s
    # more for a background job that was already running. The purge is the one that matters —
    # it renames a day's segments aside before unlinking them, and Docker's default 10s grace
    # would SIGKILL between the two, leaving a day half-hidden but still reported by HasDay.
    stop_grace_period: 45s
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATA_FOLDER=/app
      # Fail closed: an unset API_KEY would interpolate to "" and cmd/process would serve
      # /api/charts publicly. The :? guard makes `docker compose up` refuse to start instead.
      - API_KEY=${API_KEY:?API_KEY must be set in .env next to this file}
    volumes:
      - .:/app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - ingest
      - process
