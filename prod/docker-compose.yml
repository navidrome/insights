services:
  ingest:
    image: ghcr.io/navidrome/insights:main
    command: ["/ingest"]
    restart: unless-stopped
    user: "1000:1000"
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATA_FOLDER=/app
    volumes:
      - .:/app

  process:
    image: ghcr.io/navidrome/insights:main
    command: ["/process"]
    restart: unless-stopped
    user: "1000:1000"
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATA_FOLDER=/app
      - API_KEY=${API_KEY}
    volumes:
      - .:/app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - ingest
      - process
