services:
  ingest:
    image: ghcr.io/navidrome/insights:main
    command: ["/ingest"]
    restart: unless-stopped
    user: "1000:1000"
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATA_FOLDER=/app
    volumes:
      - .:/app

  process:
    image: ghcr.io/navidrome/insights:main
    command: ["/process"]
    restart: unless-stopped
    user: "1000:1000"
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATA_FOLDER=/app
      # Fail closed: an unset API_KEY would interpolate to "" and cmd/process would serve
      # /api/charts publicly. The :? guard makes `docker compose up` refuse to start instead.
      - API_KEY=${API_KEY:?API_KEY must be set in .env next to this file}
    volumes:
      - .:/app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - ingest
      - process
